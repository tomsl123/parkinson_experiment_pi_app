<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Experiment — Pi Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --bg2: #1a1d27; --bg3: #23263a; --border: #2d3148;
    --text: #e0e0e0; --muted: #6b7280; --green: #22c55e;
  }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; font-size: 13px; }
  header { display: flex; align-items: center; gap: 16px; padding: 0 20px; height: 48px;
    background: var(--bg2); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 14px; font-weight: 600; }
  header nav { display: flex; gap: 12px; margin-left: auto; }
  header nav a { color: var(--muted); text-decoration: none; font-size: 12px; }
  .page { max-width: 520px; margin: 48px auto; padding: 0 16px; }
  .back { color: var(--muted); text-decoration: none; font-size: 12px; display: inline-block; margin-bottom: 20px; }
  .back:hover { color: var(--text); }
  h2 { font-size: 18px; font-weight: 600; margin-bottom: 24px; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 24px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase;
          letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
  .optional { color: var(--border); font-size: 10px; font-weight: 400; text-transform: none; margin-left: 4px; }
  input { width: 100%; padding: 9px 12px; background: var(--bg3);
    border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; outline: none; }
  input:focus { border-color: var(--green); }
  .divider { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
  .btn { width: 100%; padding: 10px; border-radius: 6px; border: none; cursor: pointer;
         font-size: 13px; font-weight: 600; background: var(--green); color: #000; margin-top: 4px; }
  .btn:hover { opacity: .9; }
  .btn:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Pi Dashboard</h1>
  <nav><a href="/">Live Feed</a><a href="/dashboard">Experiments</a></nav>
</header>

<div class="page">
  <a href="/dashboard" class="back">← Back to Experiments</a>
  <h2>New Experiment</h2>
  <div class="card">
    <form id="form">
      <div class="field">
        <label for="patientNumber">Patient Number</label>
        <input id="patientNumber" type="text" placeholder="e.g. P-0042" required autofocus>
      </div>
      <div class="row">
        <div class="field">
          <label for="age">Age <span class="optional">(years)</span></label>
          <input id="age" type="number" min="0" max="120" step="1" placeholder="63">
        </div>
        <div class="field">
          <label for="height">Height <span class="optional">(cm)</span></label>
          <input id="height" type="number" min="50" max="250" step="0.1" placeholder="176">
        </div>
      </div>
      <div class="field">
        <label for="weight">Weight <span class="optional">(kg)</span></label>
        <input id="weight" type="number" min="0" step="0.1" placeholder="78.5">
      </div>
      <hr class="divider">
      <div class="field">
        <label for="distance">Walk Distance <span class="optional">(m, optional — improves foot speed calc)</span></label>
        <input id="distance" type="number" step="0.01" min="0" placeholder="e.g. 2.0">
      </div>
      <button class="btn" type="submit" id="btn-submit">Create Experiment →</button>
    </form>
  </div>
</div>

<script src="/dashboard.js"></script>
<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn-submit');
  btn.disabled = true; btn.textContent = 'Creating…';
  const v = (id) => document.getElementById(id).value;
  try {
    const res = await apiFetch('/experiments', {
      method: 'POST',
      body: {
        patientNumber: v('patientNumber').trim(),
        age:    v('age')    !== '' ? parseInt(v('age'))        : null,
        height: v('height') !== '' ? parseFloat(v('height'))   : null,
        weight: v('weight') !== '' ? parseFloat(v('weight'))   : null,
        distanceMeters: v('distance') !== '' ? parseFloat(v('distance')) : null,
        properties: {},
      },
    });
    location.href = `/dashboard/experiments/${res.id}`;
  } catch (err) {
    toast(`Error: ${err.message}`, 'error');
    btn.disabled = false; btn.textContent = 'Create Experiment →';
  }
});
</script>
</body>
</html>
